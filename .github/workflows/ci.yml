name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The scraper tests drive a real browser against synthetic Yahoo pages,
      # so CI needs the browser Playwright expects. Only Chromium is used.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        # The suite includes browser-driven scraper tests and a short run of the
        # season simulation, so it is slower than a pure unit suite.
        timeout-minutes: 10

      - name: Build
        run: npm run build
