<svg viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <clipPath id="brc-card"><rect x="6" y="14" width="508" height="372" rx="26"/></clipPath>
    <linearGradient id="brc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a29"/>
      <stop offset="0.32" stop-color="#123c5a"/>
      <stop offset="0.5" stop-color="#226082"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#brc-card)">
    <!-- dawn sky -->
    <rect x="6" y="14" width="508" height="372" fill="url(#brc-sky)"/>
    <ellipse cx="448" cy="198" rx="200" ry="44" fill="#f2a65a" opacity="0.14"/>
    <!-- sun -->
    <circle cx="452" cy="122" r="60" fill="#f2a65a" opacity="0.08"/>
    <circle cx="452" cy="122" r="43" fill="#f2a65a" opacity="0.14"/>
    <circle cx="452" cy="122" r="28" fill="#f5b168"/>
    <!-- clouds -->
    <rect x="58" y="58" width="122" height="10" rx="5" fill="#c9d8e2" opacity="0.10"/>
    <rect x="96" y="74" width="70" height="8" rx="4" fill="#c9d8e2" opacity="0.07"/>
    <rect x="238" y="46" width="92" height="9" rx="4.5" fill="#c9d8e2" opacity="0.09"/>
    <rect x="356" y="96" width="70" height="8" rx="4" fill="#f2b47a" opacity="0.2"/>
    <rect x="392" y="82" width="46" height="7" rx="3.5" fill="#f2b47a" opacity="0.15"/>
    <!-- gulls -->
    <path d="M96 96 L108 87 L120 96" fill="none" stroke="#d7e3ea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <path d="M142 70 L152 63 L162 70" fill="none" stroke="#d7e3ea" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
    <path d="M212 100 L220 94 L228 100" fill="none" stroke="#d7e3ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
    <!-- far water -->
    <rect x="6" y="200" width="508" height="186" fill="#0d456b"/>
    <rect x="6" y="200" width="508" height="2.5" fill="#7fb6d4" opacity="0.45"/>
    <!-- sun reflection -->
    <rect x="432" y="206" width="44" height="5" rx="2.5" fill="#f2a65a" opacity="0.45"/>
    <rect x="424" y="216" width="58" height="5" rx="2.5" fill="#f2a65a" opacity="0.28"/>
    <rect x="438" y="226" width="28" height="5" rx="2.5" fill="#f2a65a" opacity="0.18"/>
    <!-- wave band 2 -->
    <path d="M6,250 Q38,242 70,250 T134,250 T198,250 T262,250 T326,250 T390,250 T454,250 T518,250 L514,386 L6,386 Z" fill="#0e5a8a"/>
    <rect x="30" y="258" width="44" height="3" rx="1.5" fill="#6fb1d3" opacity="0.4"/>
    <rect x="200" y="262" width="34" height="3" rx="1.5" fill="#6fb1d3" opacity="0.3"/>
    <!-- boat -->
    <g>
      <!-- outrigger -->
      <path d="M380 226 L336 150" stroke="#9fb4c2" stroke-width="1.5" opacity="0.75"/>
      <!-- antenna + catch flag -->
      <path d="M352 224 L346 180" stroke="#cfdbe3" stroke-width="1.5"/>
      <path d="M346 182 L346 194 L360 188 Z" fill="#e0433d"/>
      <!-- angler -->
      <rect x="310" y="242" width="22" height="22" rx="7" fill="#1d4459"/>
      <circle cx="321" cy="233" r="6.5" fill="#e8b48a"/>
      <rect x="312" y="222" width="17" height="6" rx="3" fill="#e0433d"/>
      <rect x="307" y="226" width="10" height="3" rx="1.5" fill="#b23530"/>
      <path d="M314 250 L303 249" stroke="#1d4459" stroke-width="4" stroke-linecap="round"/>
      <!-- bent rod + line -->
      <path d="M304 252 C296 228 284 212 266 206 C256 203 246 206 238 213" fill="none" stroke="#d8c9a3" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M238 214 C218 221 196 227 178 233" fill="none" stroke="#d9e8f2" stroke-width="1.2" opacity="0.7"/>
      <!-- hardtop -->
      <rect x="336" y="224" width="100" height="8" rx="4" fill="#1d3a4e"/>
      <rect x="346" y="232" width="3" height="8" fill="#1d3a4e"/>
      <rect x="424" y="232" width="3" height="8" fill="#1d3a4e"/>
      <!-- cabin -->
      <rect x="342" y="232" width="86" height="30" rx="5" fill="#e7dcc4"/>
      <rect x="350" y="238" width="64" height="11" rx="4" fill="#132c3e"/>
      <path d="M428 234 L450 254 L428 254 Z" fill="#e7dcc4"/>
      <path d="M429 238 L442 250 L429 250 Z" fill="#132c3e"/>
      <!-- hull -->
      <path d="M300,262 L444,262 C460,261 470,257 478,250 L488,257 C487,274 481,291 472,296 L318,300 C306,300 300,290 300,280 Z" fill="#e0433d"/>
      <path d="M301,280 L483,272 L480,283 C477,290 475,294 471,295 L318,299 C308,299 302,291 301,284 Z" fill="#a92c27"/>
      <path d="M300,262 L444,262 C456,261 466,258 474,252 L476,256 C467,263 456,266 444,266 L300,266 Z" fill="#f08276" opacity="0.9"/>
      <!-- bow spray -->
      <rect x="482" y="268" width="20" height="3" rx="1.5" fill="#9cc8e0" opacity="0.5"/>
      <rect x="476" y="276" width="30" height="3" rx="1.5" fill="#9cc8e0" opacity="0.35"/>
    </g>
    <!-- wave band 3 (boat sits into this) -->
    <path d="M6,296 Q42,288 78,296 T150,296 T222,296 T294,296 T366,296 T438,296 T510,296 L514,386 L6,386 Z" fill="#17709e"/>
    <!-- wake foam -->
    <rect x="250" y="296" width="48" height="4" rx="2" fill="#7db6d6" opacity="0.5"/>
    <rect x="222" y="304" width="62" height="4" rx="2" fill="#7db6d6" opacity="0.3"/>
    <rect x="430" y="302" width="40" height="3.5" rx="1.75" fill="#7db6d6" opacity="0.35"/>
    <!-- leaping salmon -->
    <g>
      <ellipse cx="104" cy="298" rx="34" ry="6" fill="#9cc8e0" opacity="0.3"/>
      <circle cx="86" cy="256" r="2.5" fill="#a8cfe4" opacity="0.8"/>
      <circle cx="104" cy="236" r="2" fill="#a8cfe4" opacity="0.7"/>
      <circle cx="150" cy="262" r="2" fill="#a8cfe4" opacity="0.7"/>
      <circle cx="128" cy="284" r="2.5" fill="#a8cfe4" opacity="0.8"/>
      <!-- forked tail -->
      <path d="M98,254 L74,240 L84,264 L72,278 L96,272 Z" fill="#4a7a96"/>
      <!-- body -->
      <path d="M176,232 C146,212 108,220 92,258 L88,274 C102,254 124,246 146,242 C158,240 169,237 176,232 Z" fill="#b9d2e0"/>
      <!-- darker back -->
      <path d="M176,232 C146,212 108,220 92,258 C108,234 142,224 176,232 Z" fill="#4a7a96"/>
      <!-- dorsal fin -->
      <path d="M130,222 L140,206 L150,220 Z" fill="#4a7a96"/>
      <!-- pectoral fin -->
      <path d="M140,240 L132,252 L148,246 Z" fill="#8fb4c8"/>
      <!-- spots -->
      <circle cx="118" cy="234" r="1.5" fill="#35617d"/>
      <circle cx="134" cy="228" r="1.5" fill="#35617d"/>
      <circle cx="150" cy="227" r="1.5" fill="#35617d"/>
      <circle cx="88" cy="262" r="1.3" fill="#35617d"/>
      <!-- mouth -->
      <path d="M176 232 L169 236" stroke="#35617d" stroke-width="1.5" stroke-linecap="round"/>
      <!-- eye -->
      <circle cx="164" cy="230" r="2.6" fill="#10222e"/>
      <circle cx="165" cy="229" r="0.9" fill="#d9e8f2"/>
    </g>
    <!-- foreground wave band -->
    <path d="M6,342 Q46,333 86,342 T166,342 T246,342 T326,342 T406,342 T486,342 L520,342 L520,386 L6,386 Z" fill="#0b3552"/>
    <rect x="60" y="356" width="76" height="4" rx="2" fill="#2a739e" opacity="0.8"/>
    <rect x="210" y="366" width="60" height="4" rx="2" fill="#2a739e" opacity="0.6"/>
    <rect x="380" y="358" width="84" height="4" rx="2" fill="#2a739e" opacity="0.7"/>
    <rect x="96" y="310" width="52" height="3.5" rx="1.75" fill="#7db6d6" opacity="0.4"/>
    <rect x="300" y="312" width="46" height="3.5" rx="1.75" fill="#7db6d6" opacity="0.4"/>
  </g>
</svg>
