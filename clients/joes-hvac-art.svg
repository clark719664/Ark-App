    <path d="M0 -8V8M-8 0H8M-5.6 -5.6L5.6 5.6M-5.6 5.6L5.6 -5.6" transform="translate(218,74) scale(0.8)" opacity="0.6"/>
    <path d="M0 -8V8M-8 0H8M-5.6 -5.6L5.6 5.6M-5.6 5.6L5.6 -5.6" transform="translate(462,112) scale(0.85)" opacity="0.65"/>
    <path d="M0 -8V8M-8 0H8M-5.6 -5.6L5.6 5.6M-5.6 5.6L5.6 -5.6" transform="translate(168,192) scale(0.6)" opacity="0.55"/>
    <path d="M0 -8V8M-8 0H8M-5.6 -5.6L5.6 5.6M-5.6 5.6L5.6 -5.6" transform="translate(48,330) scale(1.1)" opacity="0.85" stroke="#e2e8f0"/>
